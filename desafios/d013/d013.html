<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 013 02</title>

    <style>
        * {
            margin: auto;
            padding: 10px;
        }

        tr>td {
            border: 1px solid black;
            margin: 12px;
            text-align: center;
        }
         tr td.a{
            background-color: rgb(186, 186, 186);
         }
        
        
        
    </style>
</head>

<body>
    <table>
        <tr>
            <td colspan="4" class="a">A</td>
            <td rowspan="4" class="a">B</td>
        </tr>
        <TR>
            <td rowspan="4" class="a">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </TR>

        <tr>

            <td>G</td>
            <td>H</td>
            <td>I</td>
        <tr>

            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        </tr>

        <tr>
            <td colspan="4" class="a">N</td>
        </tr>
    </table>
</body>

</html>
