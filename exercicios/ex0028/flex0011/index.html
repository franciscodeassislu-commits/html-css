<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(210, 210, 239);
            display: flex;

            flex-flow: row nowrap;
        }

        div.item {
            background-color: rgb(183, 117, 245);
            border: 1px solid rgb(13, 13, 13);
            text-align: center;

           

        }

        div#cx1 {
           /* flex-shrink: 0;
            flex-grow: 1;
             flex-basis: 200px;*/

             flex: 1 0 200px;
        }

        div#cx2 {
            /*flex-shrink: 1;
            flex-grow: 1;
             flex-basis: 150px;*/

             flex: 1 1 150px;
        }

        div#cx3 {
           /* flex-shrink:8;
            flex-grow: 1;*/
              
            flex: 1 8 auto;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="item" id="cx1">item 1</div>
        <div class="item" id="cx2">item 2</div>
        <div class="item" id="cx3">item 3</div>

    </div>

</body>

</html>
