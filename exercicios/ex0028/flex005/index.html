<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: aquamarine;
        }
       h1 {
            color: white;
            text-align: center;
        }
        main {
            background-color: rgb(64, 64, 220);
            height: 100vh;
            width: 100VW;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: rgb(220, 64, 64);
            height: 200px;
            width: 300px;
           
           
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>

</html>
