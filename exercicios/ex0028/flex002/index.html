<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(210, 210, 239);

            display: flex;
            flex-direction: row;
        }

        div.intem {
            color: aliceblue;
            background-color: rgb(146, 61, 231);
            border: 1px solid rgb(0, 0, 0);
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="intem">caixa 1</div>
        <div class="intem">caixa 2</div>
        <div class="intem">caixa 3</div>
        <div class="intem">caixa 4</div>
        <div class="intem">caixa 5</div>
        <div class="intem">caixa 6</div>
        <div class="intem">caixa 7</div>
    </div>

</body>

</html>
