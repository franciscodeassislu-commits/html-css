<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(210, 210, 239);
            display: flex;

            flex-flow: row nowrap;
        }

        div.intem {
            background-color: rgb(183, 117, 245);
            border: 1px solid rgb(13, 13, 13);
            text-align: center; 

            flex-basis: 300px;
            flex-shrink: 1;
            flex: grow 1; ;
           
        }
        
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="intem">caixa 1</div>
        <div class="intem">caixa 2</div>
        <div class="intem">caixa 3</div>
        
    </div>
    
</body>

</html>
