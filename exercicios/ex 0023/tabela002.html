<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {

            font-family: Arial, Helvetica, sans-serif;

        }

        table {

            border-collapse: collapse;
            width: 500px;
        }

        td,
        th {

            border: 1px solid black;
        }

        thead {
            background-color: rgb(116, 125, 125);
            color: white;
        }
        tfoot{
            background-color: rgb(116, 125, 125);
            color: white;
        }
        td.num{
            text-align:right ;
        }
    </style>
</head>

<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
    ANATOMIA PARA TABELAS GRANDES
    TABLE 
        CAPTION
        THEAD
           TR,TD,TH
        TBODY
           TR,TD,TH
        TFOOT
           TR,TD,TH    

    -->
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aveiro</td>
                <td class="num">88,154</td>
            </tr>
            <tr>
                <td>Ilhavo</td>
                <td class="num">43.210</td>
            </tr>
            <tr>
                <td>Vagos</td>
                <td class="num">25.167</td>
            </tr>
            <tr>
                <td>Murtosa</td>
                <td class="num">11.360</td>
            </tr>
            <tr>
                <td>Estarreja</td>
                <td class="num">27.474</td>
            </tr>
        </tbody>
        <tfoot>
            <th>Total Habitantes</th>
            <td class="num"><strong>10.749.635</strong></td>
        </tfoot>
    </table>
</body>

</html>
