<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tabelas</title>
    <STyle>
        BODY {

            font-family: 'Franklin Gothic Medium',
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
           
        }

        td{
        border: 1px solid black;
        padding: 8px;
        text-align: left;
        vertical-align: middle;

        }
        .numero{
        text-align: right;
}

    </STyle>
</head>

<body>
    <h1>Minha primeira tabela</h1>

    <!--HIRERQUIA DE TABELAS SIMPLES-->
    <!--table = tabela-->
    <!--table row = linhas de tabelas-->
    <!--table header = cabeçalho de tabela-->
    <!--table data = dados da tabela-->
    <table>
        <tr> <!--primeira linha-->

            <td class="dados01">A1</td>
            <td class="dados01">B1</td>
            <td class="dados01">C1</td>
            <td class="dados01">D1</td>

        </tr>
        <TR>
            <TD class="dados02">A2</TD>
            <TD class="dados02">B2</TD>
            <TD class="dados02">C2</TD>
            <TD class="numero ">D2</TD>
        </TR>
        <TR class="linha">
            <TD>A3</TD>
            <TD>B3</TD>
            <TD>C3</TD>
            <TD class="numero">D3</TD>
        <TR>
            <TD>A4</TD>
            <TD>B4</TD>
            <TD>C4</TD>
            <TD>D4</TD>
        </TR>

    </table>
</body>

</html>
