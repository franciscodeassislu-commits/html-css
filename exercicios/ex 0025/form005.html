<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        fieldset {
            margin-bottom: 15px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        legend {
            font-weight: bold;
            color: #555;
        }

        label {
            margin-left: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #0056b3;
        }
        
    </style>
</head>

<body>
    <H1>Exemplo de Formulário</H1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masc" value="masculino"><label for="masc">Masculino</label><br>
            <input type="radio" name="sexo" id="fem" value="feminino"><label for="fem">Feminino</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="ciclismo" id="iciclis"><label for="iciclis">Ciclismo</label><br>
            <input type="checkbox" name="natação" id="inata"><label for="inata">Natação</label><br>
            <input type="checkbox" name="tenis" id="itenis"><label for="itenis">Tenis</label><br>
            <input type="checkbox" name="Futebol" id="ifute"><label for="ifute">Futebol</label><br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="limpar">
        </p>

</body>

</html>
