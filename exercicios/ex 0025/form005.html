<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
           
        }
        

        header {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.319);
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 96%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        input[type="reset"] {
            background-color: #f44336;
            color: white;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.312);
            transform: scale(1.05);
        }
        input[type="reset"]:hover {
            background-color: #e53935;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.312);
            transform: scale(1.05);
        }
        
    </style>
</head>

<body>
    <H1 class="titulo"> Exemplo de Formulário</H1>
   
    <header>
        <form action="cadastro.php" method="get" autocomplete="on">
            <p>
                <label for="inome">Nome:</label>
                <input type="text" id="inome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input type="email" id="iemail" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            </p>
            <p>
                <label for="itelefone">Telefone:</label>
                <input type="tel" id="itelefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel" required>
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </header>
</body>

</html>
