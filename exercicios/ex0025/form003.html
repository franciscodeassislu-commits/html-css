<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            background: linear-gradient(90deg, hsla(18, 76%, 85%, 1) 0%, hsla(203, 69%, 84%, 1) 100%);

        }

        .form1 {
           font-family: 'Courier New', Courier, monospace;
            background-color: #df8787;
            width: 290px;
            height: 150px;
            margin: 5px auto;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 1px 2px 7px #0000007a;
        }

        .form1:hover {
            background-color: #f65d5d;
            transform: scale(1.04);
            transition: transform 0.4s ease;


        }

    </style>
    
</head>

<body>
    <h1>Teste de Formulário</h1>
    <div class="posicao">
        <header class="form1">
            <form action="cadastro.php" method="get" autocomplete="on">
                <p>
                    <label for="inome">Nome</label>
                    <input type="text" nome="nome" id="inome" required maxlength="30" placeholder="Nome completo"
                        autocomplete="name">
                </p>
                <p>
                    <label for="imedia">Média</label>
                    <input type="number" nome="media" id="imedia" required min="0" max="10" step="0.1"
                        placeholder="Média do aluno">
                </p>
                <label for="imes">Período Letivo </label>
                <input type="month" nome="mes" id="imes" required min="2025-01" max="2025-12">
               
                <p>
                    <label for="idia">Dia da Prova</label>
                    <input type="date" nome="dia" id="idia" required>
                </p>
                <p>
                    <label for="ihora">Hora da Prova</label>
                    <input type="time" nome="hora" id="ihora" required>
                </p>
                 <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
            </form>
    </div>
    </header>
</body>

</html>
