<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <div class="form-group">
            <label for="in1">Número 1:</label>
            <input type="number" id="in1" name="in1" min="0" max="100" required
                oninput="isoma.innerHTML = parseInt(in1.value) + parseInt(in2.value)">
        </div>
        <div class="form-group">
            <label for="in2">Número 2:</label>
            <input type="number" id="in2" name="in2" min="0" max="100" required
                oninput="isoma.innerHTML = parseInt(in1.value) + parseInt(in2.value)">
        </div>
        <div>
            <label for="isoma">Soma:</label>
            <output name="isoma" id="isoma">0</output>
        </div>
        <div>
            <form action="/submit" method="post">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">

            </form>
        </div>
</body>

</html>
