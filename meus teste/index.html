<!DOCTYPE html>
<html lang="pt">
<head>
<style>
  table {
    width: 100%;
   border-collapse: collapse; /* Remove espaços entre as bordas */
    font-family: Arial, sans-serif;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
  }
  th {
    background-color: #f4f4f4;
    color: #333;
  }
  .header-principal {
    background-color: #4CAF50;
    color: white;
    font-size: 1.2em;
  }
  .destaque {
    background-color: #e7f3fe;
    font-weight: bold;
  }
</style>
</head>
<body>

<table>
  <thead>
    <tr>
      <th colspan="4" class="header-principal">Cronograma de Estudos - Programação</th>
    </tr>
    <tr>
      <th>Horário</th>
      <th>Segunda-feira</th>
      <th>Terça-feira</th>
      <th>Quarta-feira</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="destaque">09:00 - 10:30</td>
      <td rowspan="2">Lógica de Programação</td>
      <td>HTML5</td>
      <td>CSS3</td>
    </tr>
    <tr>
      <td class="destaque">10:30 - 12:00</td>
      <td>JavaScript Base</td>
      <td>React.js</td>
    </tr>
    <tr>
      <td class="destaque">12:00 - 13:00</td>
      <td colspan="3" style="background-color: #fff3cd;">ALMOÇO / DESCANSO</td>
    </tr>
    <tr>
      <td class="destaque">13:00 - 15:00</td>
      <td>Projeto Final</td>
      <td>Projeto Final</td>
      <td>Revisão Geral</td>
    </tr>
  </tbody>
</table>

</body>
</html>
